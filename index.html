<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch API In JS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <h1 class="header-title">Use Real API (Fetch)</h1>
      <input type="text" class="search-text" placeholder="Write to search...." />
      <button type="button" class="sort-btn"><b>Sort By Price</b></button>
    </header>

    <div class="container">
      <div class="condition-wrapper">
        <!-- LOADING GIF -->
        <div class="loading-element">
          <img src="./assets/loading.gif" alt="loading" />
        </div>
        <!-- ERROR MESSAGE -->
        <h2 class="error-element"></h2>
      </div>

      <!-- PRODUCT LIST -->
      <div class="products-list-container">
        <ul class="products-list"></ul>
        <button type="button" class="load-more-btn">Load More</button>
      </div>
    </div>

    <div class="modal-overlay">
      <div class="modal-box">
        <button class="close-modal">×</button>

        <div class="modal-content"></div>
      </div>
     

    </div>
    <!-- FOOTER -->
    <footer>
      <p>Created With By Fateme Helali</p>
      <br />
      GitHub :
      <a href="https://github.com/Helali-Dev" class="link"
        >https://github.com/Helali-Dev</a
      >
    </footer>

    <!-- SCRIPTS -->
    <script src="./main.js"></script>
  </body>
</html>
